openapi: 3.0.0
info:
  title: API Sistem Informasi Akademik (MVC)
  description: |
    REST API Sistem Informasi Akademik berbasis PHP MVC (Acara 22 - Konversi
    dokumentasi Markdown Acara 21 menjadi OpenAPI 3.0).

    Seluruh response memakai format standar: `success`, `message`, `data`,
    `errors`, dan `timestamp`. Endpoint terproteksi memerlukan header
    `Authorization: Bearer <token>` (JWT, berlaku 1 jam).
  version: 1.0.0
servers:
  - url: http://localhost/sistem-informasi-akademik/public
    description: Local (default modul)
  - url: http://localhost/tugas-bkpm/Tgs_Workshop_Web_Server/Bkpm_Acara_22/sistem-informasi-akademik/public
    description: Local (folder proyek mahasiswa)
tags:
  - name: Auth
    description: Registrasi dan login (AuthController)
  - name: Mahasiswa
    description: CRUD data mahasiswa (MahasiswaController)
  - name: Buku
    description: CRUD data buku (BukuController)
paths:
  /register:
    post:
      tags: [Auth]
      summary: Registrasi pengguna baru (AuthController::register)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: adam_test
              email: adam_test@example.com
              password: Rahasia123!
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Registrasi berhasil
                data: { id: '1' }
                errors: {}
                timestamp: '2026-11-01T10:00:00+07:00'
        '400':
          description: Body bukan JSON valid atau field wajib kosong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Username atau email sudah digunakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Format email tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /login:
    post:
      tags: [Auth]
      summary: Autentikasi pengguna (AuthController::login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: adam_test
              password: Rahasia123!
      responses:
        '200':
          description: Login berhasil, mengembalikan token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Login berhasil
                data: { token: '<header>.<payload>.<signature>', role: user }
                errors: {}
                timestamp: '2026-11-01T10:00:00+07:00'
        '400':
          description: Username atau password kosong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: false
                message: Username atau password salah
                data: null
                errors: {}
                timestamp: '2026-11-01T10:00:00+07:00'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /mahasiswa:
    get:
      tags: [Mahasiswa]
      summary: Mengambil data mahasiswa (MahasiswaController::index)
      description: Tanpa parameter `id` mengembalikan seluruh data (array); dengan `id` mengembalikan satu objek.
      parameters:
        - $ref: '#/components/parameters/IdQueryOptional'
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                message: Data berhasil diambil
                data:
                  - { id: 1, nim: '220100201', nama: Siti Aminah, prodi: Teknik Informatika, created_at: '2026-10-21 08:00:00' }
                errors: {}
                timestamp: '2026-11-01T10:00:00+07:00'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Mahasiswa]
      summary: Menambahkan data mahasiswa (MahasiswaController::store)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '220100201'
              nama: Andi Saputra
              prodi: Teknik Informatika
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Body kosong atau format JSON tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/NimConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Mahasiswa]
      summary: Memperbarui data mahasiswa (MahasiswaController::update)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdQueryRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MahasiswaInput'
            example:
              nim: '220100201'
              nama: Andi Saputra S.
              prodi: Sistem Informasi
      responses:
        '200':
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NimConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Mahasiswa]
      summary: Menghapus data mahasiswa (MahasiswaController::destroy)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdQueryRequired'
      responses:
        '200':
          description: Data berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/InvalidId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /buku:
    get:
      tags: [Buku]
      summary: Mengambil data buku (BukuController::index)
      parameters:
        - $ref: '#/components/parameters/IdQueryOptional'
      responses:
        '200':
          description: Data berhasil diambil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Buku]
      summary: Menambahkan data buku (BukuController::store)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
            example:
              judul: Pemrograman Web dengan PHP
              penulis: Rahmat Hidayat
              penerbit: Informatika
              tahun_terbit: 2021
      responses:
        '201':
          description: Data berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Field wajib kosong atau tahun_terbit tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    put:
      tags: [Buku]
      summary: Memperbarui data buku (BukuController::update)
      parameters:
        - $ref: '#/components/parameters/IdQueryRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Data berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Buku]
      summary: Menghapus data buku (BukuController::destroy)
      parameters:
        - $ref: '#/components/parameters/IdQueryRequired'
      responses:
        '200':
          description: Data berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT dari POST /login (berlaku 1 jam). Kirim sebagai `header Authorization dengan awalan Bearer`.
  parameters:
    IdQueryOptional:
      name: id
      in: query
      required: false
      description: ID data. Bila dikosongkan, seluruh data dikembalikan.
      schema: { type: integer, minimum: 1 }
    IdQueryRequired:
      name: id
      in: query
      required: true
      description: ID data (angka positif)
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Token tidak ditemukan, tidak valid, atau kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Token tidak valid atau kedaluwarsa
            data: null
            errors: {}
            timestamp: '2026-11-01T10:00:00+07:00'
    InvalidId:
      description: Parameter id tidak ada atau bukan angka positif
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    NimConflict:
      description: NIM sudah terdaftar / dipakai mahasiswa lain
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    ValidationError:
      description: Validasi field gagal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            success: false
            message: Data yang dikirim tidak valid
            data: null
            errors:
              nim: [NIM harus terdiri dari tepat 9 digit angka]
              nama: [Nama wajib diisi]
            timestamp: '2026-11-01T10:00:00+07:00'
    MethodNotAllowed:
      description: Method HTTP tidak diizinkan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          nullable: true
          description: Objek, array, atau null
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        timestamp: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    MahasiswaInput:
      type: object
      required: [nim, nama, prodi]
      properties:
        nim: { type: string, pattern: '^[0-9]{9}$', description: Tepat 9 digit angka, unik }
        nama: { type: string, maxLength: 100 }
        prodi: { type: string, maxLength: 50 }
    Mahasiswa:
      allOf:
        - type: object
          properties:
            id: { type: integer }
        - $ref: '#/components/schemas/MahasiswaInput'
        - type: object
          properties:
            created_at: { type: string }
    BukuInput:
      type: object
      required: [judul, penulis, penerbit, tahun_terbit]
      properties:
        judul: { type: string, maxLength: 150 }
        penulis: { type: string, maxLength: 100 }
        penerbit: { type: string, maxLength: 100 }
        tahun_terbit: { type: integer, minimum: 1900 }