<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sistem Informasi Akademik</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #222; display: flex; justify-content: center; padding-top: 6rem; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 2rem; width: 320px; }
    h1 { font-size: 1.4rem; margin-top: 0; text-align: center; }
    label { display: block; margin-top: 1rem; font-size: .9rem; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #bbb; border-radius: 4px; }
    button { width: 100%; margin-top: 1.5rem; padding: 10px; background: #1565c0; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #90a4ae; cursor: default; }
    #pesan { margin-top: 1rem; color: #b00020; font-size: .9rem; min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <form id="form-login">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="btn-login">Masuk</button>
    </form>
    <div id="pesan"></div>
  </div>
  <script src="login.js"></script>
</body>
</html>
