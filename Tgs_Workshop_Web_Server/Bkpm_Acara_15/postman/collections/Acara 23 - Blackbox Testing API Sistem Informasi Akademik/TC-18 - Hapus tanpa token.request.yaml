  Hapus tanpa token
  Partisi: Tidak valid
  Data uji: tanpa header Authorization
  Hasil diharapkan: 401
url: "{{base_url}}/mahasiswa?id={{mhs_id_1}}"
method: DELETE
queryParams:
  id: "{{mhs_id_1}}"
scripts:
