  Data uji: id hasil S-01
  Hasil diharapkan: 200
url: "{{base_url}}/mahasiswa?id={{mhs_id_2}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
queryParams:
  id: "{{mhs_id_2}}"
scripts:
