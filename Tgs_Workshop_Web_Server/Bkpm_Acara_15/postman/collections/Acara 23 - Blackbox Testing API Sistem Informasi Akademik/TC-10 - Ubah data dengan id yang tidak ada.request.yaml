$kind: http-request
description: |-
  Ubah data dengan id yang tidak ada
  Partisi: Tidak valid
  Data uji: id=999999
  Hasil diharapkan: 404
url: "{{base_url}}/mahasiswa?id=999999"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "999999"
body:
  type: json
  content: |-
    {
      "nim": "220100123",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-10: Ubah data dengan id yang tidak ada -> 404", function () { pm.response.to.have.status(404); });
      pm.test("TC-10: format JSON & success=false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 11000
