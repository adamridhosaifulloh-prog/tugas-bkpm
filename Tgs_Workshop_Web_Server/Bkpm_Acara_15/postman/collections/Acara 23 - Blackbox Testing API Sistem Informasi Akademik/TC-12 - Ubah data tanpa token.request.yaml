$kind: http-request
description: |-
  Ubah data tanpa token
  Partisi: Tidak valid
  Data uji: tanpa header Authorization
  Hasil diharapkan: 401
url: "{{base_url}}/mahasiswa?id={{mhs_id_1}}"
method: PUT
headers:
  Content-Type: application/json
queryParams:
  id: "{{mhs_id_1}}"
body:
  type: json
  content: |-
    {
      "nim": "220100123",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-12: Ubah data tanpa token -> 401", function () { pm.response.to.have.status(401); });
      pm.test("TC-12: format JSON & success=false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 13000
