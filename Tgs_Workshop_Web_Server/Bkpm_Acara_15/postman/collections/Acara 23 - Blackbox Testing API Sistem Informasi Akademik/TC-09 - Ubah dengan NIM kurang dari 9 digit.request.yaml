$kind: http-request
description: |-
  Ubah dengan NIM kurang dari 9 digit
  Partisi: Tidak valid
  Data uji: nim 8 digit
  Hasil diharapkan: 422
url: "{{base_url}}/mahasiswa?id={{mhs_id_1}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{mhs_id_1}}"
body:
  type: json
  content: |-
    {
      "nim": "22010012",
      "nama": "Andi Saputra",
      "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-09: Ubah dengan NIM kurang dari 9 digit -> 422", function () { pm.response.to.have.status(422); });
      pm.test("TC-09: format JSON & success=false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 10000
