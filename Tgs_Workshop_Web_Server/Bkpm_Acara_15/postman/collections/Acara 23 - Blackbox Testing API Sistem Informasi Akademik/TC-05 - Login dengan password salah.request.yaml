$kind: http-request
description: |-
  Login dengan password salah
  Partisi: Tidak valid
  Data uji: password salah
  Hasil diharapkan: 401
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{auth_username}}",
      "password": "password_salah"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("TC-05: Login dengan password salah -> 401", function () { pm.response.to.have.status(401); });
      pm.test("TC-05: format JSON & success=false", function () { pm.expect(pm.response.json().success).to.eql(false); });
    language: text/javascript
order: 2000
