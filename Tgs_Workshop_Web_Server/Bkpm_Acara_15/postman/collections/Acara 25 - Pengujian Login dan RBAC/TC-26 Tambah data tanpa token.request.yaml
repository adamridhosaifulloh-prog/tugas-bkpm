$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nim": "250000001",
      "nama": "Uji RBAC",
      "prodi": "Teknik Informatika"
    }
scripts:
