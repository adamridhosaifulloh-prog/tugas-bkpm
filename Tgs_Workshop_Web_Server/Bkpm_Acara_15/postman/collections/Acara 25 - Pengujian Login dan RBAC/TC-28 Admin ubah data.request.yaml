$kind: http-request
url: "{{base_url}}/mahasiswa?id={{id_uji}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token_admin}}
queryParams:
  id: "{{id_uji}}"
body:
  type: json
  content: |-
    {
      "nim": "250000001",
      "nama": "Uji RBAC Update",
      "prodi": "Sistem Informasi"
    }
scripts:
  - type: afterResponse
    code: pm.test("TC-28 Admin ubah data -> 200", function () { pm.expect([200]).to.include(pm.response.code); });
    language: text/javascript
order: 11000
