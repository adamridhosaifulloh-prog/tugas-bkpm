$kind: http-request
name: 3. GET mahasiswa ?id
url: "{{base_url}}/mahasiswa?id={{mhs_id}}"
method: GET
queryParams:
  id: "{{mhs_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 200", function () { pm.response.to.have.status(200); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 3000
