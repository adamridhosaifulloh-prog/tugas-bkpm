$kind: http-request
url: "{{base_url}}/mahasiswa?id={{mhs_id}}"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "{{mhs_id}}"
body:
  type: json
  content: |-
    {
        "nim": "2201001",
        "nama": "Andi Saputra, S.Kom",
        "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 200", function () { pm.response.to.have.status(200); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 4000
