$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{invalid_token}}
body:
  type: json
  content: |-
    {
        "nim": "2201098",
        "nama": "Tes Token Palsu",
        "prodi": "Teknik Informatika"
    }
scripts:
