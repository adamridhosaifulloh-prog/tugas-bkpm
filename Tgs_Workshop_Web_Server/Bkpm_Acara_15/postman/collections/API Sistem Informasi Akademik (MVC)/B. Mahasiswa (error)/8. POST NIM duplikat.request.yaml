$kind: http-request
url: "{{base_url}}/mahasiswa"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
        "nim": "2201002",
        "nama": "Duplikat",
        "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 409", function () { pm.response.to.have.status(409); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 2000
