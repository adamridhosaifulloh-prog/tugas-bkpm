$kind: http-request
url: "{{base_url}}/mahasiswa?id=9999"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
queryParams:
  id: "9999"
body:
  type: json
  content: |-
    {
        "nim": "2201001",
        "nama": "Andi Saputra",
        "prodi": "Teknik Informatika"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 404", function () { pm.response.to.have.status(404); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 6000
