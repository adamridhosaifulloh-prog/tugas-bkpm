$kind: http-request
description: Gunakan akun yang sudah berhasil diregistrasi pada Acara 19. Token dari response akan disimpan ke environment variable token.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "{{auth_username}}",
        "password": "{{auth_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 200", function () { pm.response.to.have.status(200); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
      if (pm.response.code === 200 && pm.response.json().data.token) { pm.environment.set("token", pm.response.json().data.token); }
      pm.test("Token diterima", function () { pm.expect(pm.response.json().data.token).to.be.a("string"); });
    language: text/javascript
order: 4000
