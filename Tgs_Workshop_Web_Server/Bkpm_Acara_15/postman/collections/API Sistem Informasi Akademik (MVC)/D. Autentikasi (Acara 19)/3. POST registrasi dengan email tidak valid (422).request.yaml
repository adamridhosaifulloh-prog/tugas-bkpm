$kind: http-request
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "email_salah",
        "email": "bukan-email",
        "password": "Rahasia123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 422", function () { pm.response.to.have.status(422); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 3000
