$kind: http-request
description: "Pengujian gagal: password sengaja tidak dikirim."
url: "{{base_url}}/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "username": "user_tanpa_password",
        "email": "tanpa_password@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code 400", function () { pm.response.to.have.status(400); });
      pm.test("Response berformat JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 2000
